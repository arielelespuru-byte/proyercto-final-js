<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Express | Componentes PC</title>
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS de Toastify -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">⚡ Hardware Express</a>
            <button class="btn btn-outline-light position-relative" id="btnCarrito" data-bs-toggle="modal" data-bs-target="#modalCarrito">
                🛒 Carrito
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="contadorCarrito">
                    0
                </span>
            </button>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-4">
        <div class="row mb-4">
            <div class="col-md-6">
                <h1 class="h3 fw-bold text-secondary">Catálogo de Productos</h1>
                <p class="text-muted">Armá tu compa o llevate los mejores componentes.</p>
            </div>
            <div class="col-md-6 d-flex align-items-center justify-content-md-end">
                <div class="input-group w-75">
                    <input type="text" id="inputBusqueda" class="form-control" placeholder="Buscar componente...">
                </div>
            </div>
        </div>

        <!-- Contenedor de Productos -->
        <div class="row row-cols-1 row-cols-md-3 g-4" id="contenedorProductos">
            <!-- Los productos se cargan dinámicamente con JS -->
        </div>
    </main>

    <!-- Modal del Carrito -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCarritoLabel">🛒 Tu Carrito de Compras</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="itemsCarrito">
                                <!-- Elementos del carrito -->
                            </tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <h4 class="fw-bold mb-0">Total: $<span id="precioTotal">0</span></h4>
                        <button class="btn btn-outline-danger btn-sm" id="btnVaciarCarrito">Vaciar Carrito</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Seguir viendo</button>
                    <button type="button" class="btn btn-success" id="btnFinalizarCompra">Confirmar Compra</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts externos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- Scripts Propios (máximo 2 archivos JS) -->
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
